spring.application.name=aluguelcarros

# Variáveis do backend/.env, quando o arquivo existir
spring.config.import=optional:file:.env[.properties]

# Sem variáveis de banco, sobe com H2
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

server.error.include-message=never

# Senha padrão do Spring Security desligada: o login é feito pela API
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Sessão: JWT num cookie HttpOnly
app.jwt.secret=${JWT_SECRET}
app.jwt.validade-horas=8
app.cookie.nome=sessao
app.cookie.seguro=false
